# Pre-commit hooks. Install with:  pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff            # lint (backend)
        args: [--fix]
        files: ^backend/
      - id: ruff-format     # format (backend)
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.4.2
    hooks:
      - id: prettier        # format (frontend)
        files: ^frontend/src/
        additional_dependencies:
          - prettier@3.4.2

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: detect-private-key   # guard against committing key material

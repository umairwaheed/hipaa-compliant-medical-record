# nginx vhost for hipaa.getprixite.com. Name-based TLS vhost on 443 (coexists
# with the other vhosts on this host via SNI). Serves the built SPA, proxies
# /api to the localhost-bound API, rate-limits login, sets HSTS + headers.
# Rate-limit zones are defined in conf.d/hipaa-ratelimit.conf.
# Install to /etc/nginx/sites-available/hipaa and symlink into sites-enabled
# (or /etc/nginx/conf.d/hipaa.conf, matching the host's convention).

server {
    listen 80;
    listen [::]:80;
    server_name hipaa.getprixite.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hipaa.getprixite.com;

    ssl_certificate     /etc/letsencrypt/live/hipaa.getprixite.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hipaa.getprixite.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # HSTS — force HTTPS for a year (§164.312(e) Transmission Security).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 2m;
    root /home/hipaa/hipaa-compliant-medical-record/frontend/dist;
    index index.html;

    # Throttle the login endpoint (brute-force defense complementing DB lockout).
    location = /api/auth/login {
        limit_req zone=hipaa_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        limit_req zone=hipaa_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # PHI responses must never be cached by intermediaries.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

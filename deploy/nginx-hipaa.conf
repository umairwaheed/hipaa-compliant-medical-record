# nginx vhost for the HIPAA app. Listens on a dedicated TLS port (8443) so it is
# fully isolated from the other vhosts already on this host and works by IP
# immediately. Install to /etc/nginx/sites-available/hipaa and symlink into
# sites-enabled. Rate-limit zone is defined in conf.d/hipaa-ratelimit.conf.
#
# Replace the self-signed cert with a CA-issued cert (certbot) once a domain is
# pointed here, and set server_name accordingly.

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/hipaa.crt;
    ssl_certificate_key /etc/nginx/ssl/hipaa.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # HSTS — force HTTPS for a year (§164.312(e) Transmission Security).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # PHI must never be cached by intermediaries.
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    client_max_body_size 2m;
    root /home/hipaa/hipaa-compliant-medical-record/frontend/dist;
    index index.html;

    # Throttle the login endpoint (brute-force defense complementing DB lockout).
    location = /api/auth/login {
        limit_req zone=hipaa_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/ {
        limit_req zone=hipaa_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

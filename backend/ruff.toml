# Ruff config — linter + formatter for the backend.
line-length = 100
target-version = "py312"
# Alembic migration files are autogenerated; don't lint/format them.
extend-exclude = ["alembic/versions"]

[lint]
select = ["E", "F", "W", "I", "UP"]
# Line length is enforced by the formatter; E501 would also flag unwrappable
# long strings/comments, so leave it to `ruff format`.
ignore = ["E501"]

[format]
quote-style = "double"
